name: Release fbtriton (dev)
# Builds fbtriton wheels from a ref and uploads them to an existing GitHub
# release, so people can pip install a dev build without building from source.
#
# Deliberately minimal: no tag is created, no release notes are written, no
# PyPI, no PEP 503 index. It only appends wheels to a release that already
# exists. Defaults to the general 'dev' bucket, which holds dev wheels for
# every release line -- wheel filenames carry +git<sha>, so lines never
# collide. Point `release` elsewhere for a line-specific bucket.
#
# Two different refs are in play, so they have different names:
#   --ref        picks which branch's copy of THIS WORKFLOW runs. It must be
#                the default branch, since that is where workflow_dispatch
#                exposes it.
#   build_ref    picks which commit gets BUILT.
#
#   gh workflow run release-fbtriton.yml --ref main -f build_ref=release/3.8.x

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Tag of an existing GitHub release to upload into"
        type: string
        default: "dev"
      build_ref:
        description: "Branch, tag or SHA to build. Blank = the branch you dispatched on (NOT gh's --ref, which selects the workflow file)."
        type: string
        required: false
        default: ""
      pythons:
        description: "ABI matrix, JSON array"
        type: string
        default: '["cp312"]'
      arches:
        description: "Arch matrix, JSON array"
        type: string
        default: '["x86_64","aarch64"]'

# read-all so the build job can satisfy wheels_fb.yml's own `permissions:
# read-all` -- a reusable workflow cannot request more than its caller.
permissions: read-all

concurrency:
  group: release-fbtriton-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.build_ref || github.ref_name }}
      - id: pick
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    # Passing the resolved SHA rather than the ref name is load-bearing, and
    # not only to pin the commit while a branch moves. actions/checkout
    # detaches HEAD for a SHA, so setup.py's get_git_branch() returns "HEAD",
    # which does not start with "release", so get_git_version_suffix() appends
    # +git<short> and the wheel comes out as fbtriton-<base>+git<sha>.
    # Checking out a release/* branch by *name* would instead yield a bare
    # <base>, and every build of that line would collide on filename.
    #
    # That is also why no `version` is passed: setup.py already produces the
    # scheme we want, so wheels_fb.yml needs no changes.
    uses: ./.github/workflows/wheels_fb.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      pythons: ${{ inputs.pythons }}
      arches: ${{ inputs.arches }}

  publish:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload release assets
      actions: read     # download-artifact
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: Upload wheels
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release }}
        run: |
          ls -la dist/
          # --clobber so re-running against the same commit replaces the
          # assets instead of failing.
          gh release upload "$RELEASE_TAG" dist/*.whl --clobber

      - name: Summary
        env:
          RELEASE_TAG: ${{ inputs.release }}
          BASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/download
        run: |
          {
            echo "Built \`${{ needs.resolve.outputs.sha }}\` into \`$RELEASE_TAG\`."
            echo
            for w in dist/*.whl; do
              echo "    pip install $BASE_URL/$RELEASE_TAG/$(basename "$w")"
            done
          } >> "$GITHUB_STEP_SUMMARY"
